[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-battlefield"
version = "0.4.0"
description = "Battlefield 6, 4 and 1 levels (Frostbite) from your own install into 3DHeat levels: terrain, placed meshes, colour maps, walkable surfaces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "heat3d-gamefiles @ https://github.com/Holdi601/3DHeat-GameFiles/archive/refs/tags/v1.1.0.zip",
    "numpy>=2.0",
    "Pillow>=10.0",
    "lz4>=4.3",
    "zstandard>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-battlefield-maps = "heat3d_ext_battlefield.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_battlefield", "heat3d_ext_battlefield.app"]
